services:

  # =========================
  # Redis
  # =========================
  redis:
    image: redis:latest
    container_name: redis

    ports:
      - "6378:6379"

    volumes:
      - redis_data:/data

    networks:
      - ecommerce-network

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5


  # =========================
  # Elasticsearch
  # =========================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.4
    container_name: ecommerce-elasticsearch

    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"

    ports:
      - "9200:9200"

    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data

    networks:
      - ecommerce-network

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fs http://localhost:9200/_cluster/health || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10


  # =========================
  # Kibana
  # =========================
  kibana:
    image: docker.elastic.co/kibana/kibana:9.5.4
    container_name: ecommerce-kibana

    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200

    ports:
      - "5601:5601"

    networks:
      - ecommerce-network

    depends_on:
      elasticsearch:
        condition: service_healthy


# =========================
# Volumes
# =========================
volumes:

  redis_data:
    driver: local

  elasticsearch_data:
    driver: local


# =========================
# Network
# =========================
networks:

  ecommerce-network:
    driver: bridge